<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Blue rounded background -->
  <rect width="64" height="64" rx="14" fill="#2563EB"/>
  <!-- Share2 icon (white) centered -->
  <!-- Fork lines -->
  <line x1="14" y1="24" x2="36" y2="16" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="14" y1="40" x2="36" y2="48" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <line x1="36" y1="16" x2="36" y2="48" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Left dot (source) -->
  <circle cx="14" cy="32" r="5" fill="white"/>
  <!-- Top-right dot -->
  <circle cx="50" cy="16" r="5" fill="white"/>
  <!-- Bottom-right dot -->
  <circle cx="50" cy="48" r="5" fill="white"/>
  <!-- Top connector -->
  <line x1="36" y1="16" x2="45" y2="16" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
  <!-- Bottom connector -->
  <line x1="36" y1="48" x2="45" y2="48" stroke="white" stroke-width="4.5" stroke-linecap="round"/>
</svg>
